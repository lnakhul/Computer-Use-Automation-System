[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-automation-system"
version = "0.1.0"
description = "Typed contracts for reusable computer-use automation capabilities"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4", "httpx>=0.27,<1", "playwright>=1.45,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]